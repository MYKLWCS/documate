# Documate on dgb-n8n-prod — /opt/dollar-loans/documate/compose.yml (root-only on the server).
# Secrets live next to it in .env and cert.p12 (never in git). deploy.sh rewrites only the documate image digest.
name: documate

networks:
  documate_db:
    name: documate_db
    internal: true          # database network: no route out
  documate_edge:
    name: documate_edge     # shared with the Cloudflare tunnel connector (n8n-cloudflared-1)

volumes:
  documate-db-storage:
    name: documate-db-storage

services:
  documate-db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: documate-db
    restart: always
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - documate-db-storage:/var/lib/postgresql/data
    networks: [documate_db]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U documate -d documate"]
      interval: 5s
      timeout: 5s
      retries: 20

  documate:
    image: ghcr.io/myklwcs/documate@sha256:b555794fd55d36f47e2ba23f1450183a190c0e6421885256a62e4b911b38a6d7
    container_name: documate
    restart: always
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    volumes:
      - ./cert.p12:/opt/documate/cert.p12:ro
    networks: [documate_db, documate_edge]
    mem_limit: 1g
    depends_on:
      documate-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
